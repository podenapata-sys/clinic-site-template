    <h1 data-en="When Do You Really Need a Root Canal?" data-bn="কখন সত্যিই রুট ক্যানেল দরকার?"></h1>
    <p data-en="4 min read · Example Dental" data-bn="৪ মিনিট পড়া · উদাহরণ ডেন্টাল" style="color:var(--muted);margin-top:10px"></p>

<article class="section" style="padding-top:40px"><div class="container" style="max-width:780px">
  <p data-en="&quot;Root canal&quot; sounds scary, but it's a routine treatment that relieves pain and saves a tooth that would otherwise be lost. Here's how to know when you might need one." data-bn="&quot;রুট ক্যানেল&quot; শুনতে ভীতিকর, কিন্তু এটি একটি সাধারণ চিকিৎসা যা ব্যথা কমায় এবং যে দাঁত হারিয়ে যেত তা বাঁচায়। কখন এটি দরকার হতে পারে তা জেনে নিন।" style="font-size:1.15rem;color:var(--ink);font-weight:500"></p>
  <h2 data-en="What a root canal actually does" data-bn="রুট ক্যানেল আসলে কী করে" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="When decay or injury reaches the soft pulp inside a tooth, it becomes infected and painful. A root canal removes that infected pulp, disinfects the inside of the tooth and seals it — letting you keep your natural tooth instead of extracting it." data-bn="পোকা বা আঘাত দাঁতের ভেতরের নরম অংশে (পাল্প) পৌঁছালে সেটি পচে গিয়ে ব্যথা করে। রুট ক্যানেল সেই পচা অংশ সরিয়ে, দাঁতের ভেতর জীবাণুমুক্ত করে বন্ধ করে দেয় — দাঁত তুলে ফেলার বদলে আসল দাঁত বাঁচায়।" style="color:var(--muted)"></p><h2 data-en="Warning signs to watch for" data-bn="যেসব সতর্ক সংকেত খেয়াল করবেন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="See a dentist soon if you have: persistent or throbbing toothache, lingering sensitivity to hot or cold, pain when biting, a swollen or tender gum, or a darkening tooth. These can mean the pulp is infected." data-bn="দ্রুত ডেন্টিস্ট দেখান যদি থাকে: একটানা বা দপদপ করা দাঁতব্যথা, গরম-ঠান্ডায় দীর্ঘ সংবেদনশীলতা, কামড়ে ব্যথা, ফোলা বা নরম মাড়ি, অথবা দাঁত কালচে হয়ে যাওয়া। এগুলো পাল্প সংক্রমণের লক্ষণ হতে পারে।" style="color:var(--muted)"></p><h2 data-en="Is it painful?" data-bn="এটি কি ব্যথাদায়ক?" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="With modern anaesthesia and techniques, a root canal feels much like a normal filling. At Example Dental we focus on painless treatment — many cases are completed comfortably, sometimes in a single visit." data-bn="আধুনিক অ্যানেস্থেসিয়া ও কৌশলে রুট ক্যানেল অনেকটা সাধারণ ফিলিংয়ের মতো অনুভব হয়। উদাহরণ ডেন্টালে আমরা ব্যথাহীন চিকিৎসায় গুরুত্ব দিই — অনেক ক্ষেত্রে এক ভিজিটেই আরামে সম্পন্ন হয়।" style="color:var(--muted)"></p><h2 data-en="What happens if you wait" data-bn="দেরি করলে কী হয়" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="An untreated infection can spread, cause an abscess, and may lead to losing the tooth entirely. Treating it early is simpler, cheaper and saves your natural tooth." data-bn="চিকিৎসা না করালে সংক্রমণ ছড়িয়ে পুঁজ (অ্যাবসেস) হতে পারে এবং দাঁত পুরোপুরি হারিয়ে যেতে পারে। আগেভাগে চিকিৎসা করালে তা সহজ, সাশ্রয়ী খরচের ও আসল দাঁত বাঁচে।" style="color:var(--muted)"></p>
  <div class="calc-out" style="margin-top:36px">
    <span data-en="Have tooth pain or sensitivity? Don't wait — book a check-up with Dr. Ayesha Rahman and find out if a quick, painless root canal can save your tooth." data-bn="দাঁতে ব্যথা বা সংবেদনশীলতা? দেরি করবেন না — ডা. আয়েশা রহমানের কাছে চেকআপ বুক করুন এবং জানুন দ্রুত, ব্যথাহীন রুট ক্যানেল আপনার দাঁত বাঁচাতে পারে কিনা।" style="display:block;margin-bottom:16px"></span>
