<article class="section" style="padding-top:40px"><div class="container" style="max-width:780px">
  <p data-en="Braces and aligners work best when you look after them. A little daily care keeps treatment on schedule and your teeth healthy along the way." data-bn="যত্ন নিলে ব্রেসেস ও অ্যালাইনার সবচেয়ে ভালো কাজ করে। সামান্য দৈনিক যত্ন চিকিৎসাকে সময়মতো রাখে ও দাঁত সুস্থ রাখে।" style="font-size:1.15rem;color:var(--ink);font-weight:500"></p>
  <h2 data-en="Keep them clean" data-bn="পরিষ্কার রাখুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Food traps easily around braces, so brush after every meal and floss carefully with a floss threader. For clear aligners, rinse and gently brush them daily, and always brush before putting them back in." data-bn="ব্রেসেসের চারপাশে সহজেই খাবার আটকে যায়, তাই প্রতিবার খাওয়ার পর ব্রাশ করুন এবং ফ্লস থ্রেডার দিয়ে সাবধানে ফ্লস করুন। ক্লিয়ার অ্যালাইনার প্রতিদিন ধুয়ে আলতো ব্রাশ করুন, এবং ফিরিয়ে দেওয়ার আগে সবসময় ব্রাশ করুন।" style="color:var(--muted)"></p><h2 data-en="Watch what you eat" data-bn="কী খাচ্ছেন খেয়াল রাখুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Avoid hard, sticky and very sugary foods that can damage brackets or wires — like hard nuts, sticky candy and ice. Cut crunchy foods into small pieces to protect your braces." data-bn="শক্ত, আঠালো ও খুব মিষ্টি খাবার এড়িয়ে চলুন যা ব্র্যাকেট বা তার নষ্ট করতে পারে — যেমন শক্ত বাদাম, আঠালো ক্যান্ডি ও বরফ। মুচমুচে খাবার ছোট টুকরো করে খান।" style="color:var(--muted)"></p><h2 data-en="Wear aligners as instructed" data-bn="নির্দেশমতো অ্যালাইনার পরুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Clear aligners only work if worn 20–22 hours a day. Keep to your schedule and store them in their case when eating, so they don't get lost or damaged." data-bn="ক্লিয়ার অ্যালাইনার দিনে ২০–২২ ঘণ্টা পরলে তবেই কাজ করে। সময়সূচি মেনে চলুন এবং খাওয়ার সময় কেসে রাখুন যাতে হারিয়ে বা নষ্ট না হয়।" style="color:var(--muted)"></p><h2 data-en="Don't skip your appointments" data-bn="অ্যাপয়েন্টমেন্ট বাদ দেবেন না" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Regular adjustments keep your treatment moving. If a wire or bracket comes loose, call us — small issues are quick to fix and prevent delays." data-bn="নিয়মিত সমন্বয় চিকিৎসাকে এগিয়ে রাখে। তার বা ব্র্যাকেট ঢিলা হলে আমাদের কল করুন — ছোট সমস্যা দ্রুত ঠিক হয় ও দেরি রোধ করে।" style="color:var(--muted)"></p>
