<article class="section" style="padding-top:40px"><div class="container" style="max-width:780px">
  <p data-en="Healthy teeth aren't about expensive treatments — they're built on small daily habits. Here are five simple things you can start today to protect your smile for life." data-bn="সুস্থ দাঁত দামি চিকিৎসার ব্যাপার নয় — এটি গড়ে ওঠে ছোট ছোট দৈনিক অভ্যাসে। সারাজীবন আপনার হাসি রক্ষা করতে আজই শুরু করার মতো পাঁচটি সহজ বিষয়।" style="font-size:1.15rem;color:var(--ink);font-weight:500"></p>
  <h2 data-en="1. Brush properly, twice a day" data-bn="১. দিনে দুবার সঠিকভাবে ব্রাশ করুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Brush for two full minutes, morning and night, with a soft brush and fluoride toothpaste. Angle the brush gently at the gum line and don't scrub hard — gentle, thorough brushing protects both teeth and gums." data-bn="সকাল ও রাতে নরম ব্রাশ ও ফ্লোরাইড টুথপেস্ট দিয়ে পুরো দুই মিনিট ব্রাশ করুন। মাড়ির কাছে ব্রাশ হালকা কোণে ধরুন এবং জোরে ঘষবেন না — কোমল, পূর্ণ ব্রাশিং দাঁত ও মাড়ি দুটোই রক্ষা করে।" style="color:var(--muted)"></p><h2 data-en="2. Floss once a day" data-bn="২. দিনে একবার ফ্লস করুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="A toothbrush can't reach between teeth, where decay and gum disease often start. Flossing once daily removes the plaque your brush misses and keeps your gums firm and healthy." data-bn="টুথব্রাশ দাঁতের ফাঁকে পৌঁছায় না, যেখানে প্রায়ই ক্ষয় ও মাড়ির রোগ শুরু হয়। দিনে একবার ফ্লস ব্রাশে না-যাওয়া প্লাক দূর করে মাড়ি শক্ত ও সুস্থ রাখে।" style="color:var(--muted)"></p><h2 data-en="3. Cut down on sugary drinks &amp; snacks" data-bn="৩. চিনিযুক্ত পানীয় ও স্ন্যাকস কমান" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Sugar feeds the bacteria that cause cavities. Limit sweets, soft drinks and frequent snacking, and rinse with water after sugary food to reduce acid attacks on your teeth." data-bn="চিনি সেই ব্যাকটেরিয়াকে খাওয়ায় যা ক্যাভিটি তৈরি করে। মিষ্টি, সফট ড্রিংক ও ঘন ঘন স্ন্যাকিং কমান, এবং মিষ্টি খাবারের পর পানি দিয়ে কুলকুচি করুন।" style="color:var(--muted)"></p><h2 data-en="4. Drink water and don't smoke" data-bn="৪. পানি পান করুন, ধূমপান নয়" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Water washes away food and keeps your mouth hydrated, while tobacco stains teeth and is a leading cause of gum disease and oral cancer. Quitting is one of the best things you can do for your mouth." data-bn="পানি খাবার ধুয়ে দেয় ও মুখ আর্দ্র রাখে, আর তামাক দাঁতে দাগ ফেলে এবং মাড়ির রোগ ও ওরাল ক্যান্সারের প্রধান কারণ। ধূমপান ছাড়া আপনার মুখের জন্য সেরা সিদ্ধান্তগুলোর একটি।" style="color:var(--muted)"></p><h2 data-en="5. Visit your dentist every 6 months" data-bn="৫. প্রতি ৬ মাসে ডেন্টিস্টের কাছে যান" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Regular check-ups and scaling catch small problems before they become painful and expensive. A professional cleaning twice a year keeps your smile bright and your gums healthy." data-bn="নিয়মিত চেকআপ ও স্কেলিং ছোট সমস্যা ব্যথাদায়ক ও ব্যয়বহুল হওয়ার আগেই ধরে ফেলে। বছরে দুবার পেশাদার পরিষ্কার আপনার হাসি উজ্জ্বল ও মাড়ি সুস্থ রাখে।" style="color:var(--muted)"></p>
  <div class="calc-out" style="margin-top:36px">
    <span data-en="Build these habits in and most dental problems can be prevented. Due for a check-up? Book a visit with Dr. Ayesha Rahman at Example Dental." data-bn="এই অভ্যাসগুলো গড়ে তুললে বেশিরভাগ দাঁতের সমস্যা প্রতিরোধ করা যায়। চেকআপের সময় হয়েছে? উদাহরণ ডেন্টালে ডা. আয়েশা রহমানের কাছে অ্যাপয়েন্টমেন্ট নিন।" style="display:block;margin-bottom:16px"></span>
