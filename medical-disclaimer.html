<article class="section" style="padding-top:20px"><div class="container"><div class="legal-doc">

  <div class="legal-callout"><p data-en="The information on this website is for general education only. It is not medical or dental advice, diagnosis or treatment, and should not replace a consultation with a qualified dentist." data-bn="এই ওয়েবসাইটের তথ্য শুধুমাত্র সাধারণ শিক্ষার জন্য। এটি চিকিৎসা বা দন্ত পরামর্শ, রোগনির্ণয় বা চিকিৎসা নয়, এবং একজন যোগ্য দন্তচিকিৎসকের পরামর্শের বিকল্প হওয়া উচিত নয়।"></p></div>

  <h2 data-en="No professional relationship" data-bn="কোনো পেশাদার সম্পর্ক নয়"></h2>
  <p data-en="Reading this website, or messaging us through it, does not create a dentist–patient relationship. That relationship begins only when you visit the clinic and are examined and accepted for care." data-bn="এই ওয়েবসাইট পড়া বা এর মাধ্যমে আমাদের মেসেজ করা কোনো দন্তচিকিৎসক–রোগী সম্পর্ক তৈরি করে না। সেই সম্পর্ক কেবল তখনই শুরু হয় যখন আপনি ক্লিনিকে এসে পরীক্ষিত ও চিকিৎসার জন্য গৃহীত হন।"></p>

  <h2 data-en="Always seek professional advice" data-bn="সবসময় পেশাদার পরামর্শ নিন"></h2>
  <p data-en="Every mouth is different. Always consult a highly skilled and registered professional dentist before starting, stopping or changing any treatment. Never ignore or delay professional advice because of something you read here." data-bn="প্রত্যেকের মুখ আলাদা। কোনো চিকিৎসা শুরু, বন্ধ বা পরিবর্তনের আগে সবসময় একজন উচ্চ দক্ষ ও নিবন্ধিত পেশাদার দন্তচিকিৎসকের পরামর্শ নিন। এখানে পড়া কিছুর কারণে কখনো পেশাদার পরামর্শ উপেক্ষা বা দেরি করবেন না।"></p>

  <h2 data-en="Results vary" data-bn="ফলাফল ভিন্ন হয়"></h2>
  <p data-en="Photos, success rates and outcomes shown on this site are examples. Individual results depend on your dental condition, health and aftercare, and cannot be guaranteed." data-bn="এই সাইটে দেখানো ছবি, সাফল্যের হার ও ফলাফল আয়েশামাত্র। ব্যক্তিগত ফলাফল আপনার দাঁতের অবস্থা, স্বাস্থ্য ও পরবর্তী যত্নের উপর নির্ভর করে এবং নিশ্চয়তা দেওয়া যায় না।"></p>

  <h2 data-en="Prices are estimates" data-bn="মূল্য আনুমানিক"></h2>
  <p data-en="The prices shown on this website and in the cost calculator are approximate ranges given only to help you plan — they are not a quote or a final bill. Your actual treatment plan and total cost depend on your specific dental condition, the number of teeth or units involved, the materials you choose and any additional care you may need, and can be confirmed only after an in-person examination (and X-rays where required). Prices may also change over time, so please contact us for the most up-to-date pricing before you decide." data-bn="এই ওয়েবসাইট ও খরচ ক্যালকুলেটরে দেখানো মূল্য কেবল পরিকল্পনায় সাহায্য করার জন্য একটি আনুমানিক পরিসর — এটি কোনো চূড়ান্ত মূল্য বা বিল নয়। আপনার প্রকৃত চিকিৎসা পরিকল্পনা ও মোট খরচ নির্ভর করে আপনার দাঁতের নির্দিষ্ট অবস্থা, কতগুলো দাঁত বা ইউনিট জড়িত, আপনি কোন উপকরণ বেছে নেন এবং প্রয়োজনীয় অতিরিক্ত যত্নের উপর, এবং তা কেবল সরাসরি পরীক্ষা (এবং প্রয়োজনে এক্স-রে) করার পরই নিশ্চিত হয়। মূল্য সময়ের সঙ্গে পরিবর্তনও হতে পারে, তাই সিদ্ধান্ত নেওয়ার আগে সবচেয়ে হালনাগাদ মূল্যের জন্য অনুগ্রহ করে আমাদের সঙ্গে যোগাযোগ করুন।"></p>

  <h2 data-en="In an emergency" data-bn="জরুরি অবস্থায়"></h2>
  <p data-en="If you have severe pain, heavy bleeding, swelling that affects breathing or swallowing, or another serious problem, do not rely on this website — call us immediately, or go to the nearest hospital or emergency service." data-bn="তীব্র ব্যথা, বেশি রক্তক্ষরণ, শ্বাস বা গিলতে সমস্যা করে এমন ফোলা, বা অন্য গুরুতর সমস্যা হলে এই ওয়েবসাইটের উপর নির্ভর করবেন না — সঙ্গে সঙ্গে আমাদের ফোন করুন, অথবা নিকটস্থ হাসপাতাল বা জরুরি সেবায় যান।"></p>
